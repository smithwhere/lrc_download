name: Pure API Sync Releases

on:
  schedule:
    - cron: '0 0,12 * * *' # 每 12 小时自动检查
  workflow_dispatch:      # 支持手动运行

concurrency:
  group: sync-releases
  cancel-in-progress: false

jobs:
  api-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Sync via GitHub API
        id: sync
        uses: actions/github-script@v8
        env:
          # Schedule uses the default branch; workflow_dispatch uses the selected branch.
          SYNC_TARGET_BRANCH: ${{ github.ref_name }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        with:
          github-token: ${{ secrets.SYNC_TOKEN }}
          script: |
            const upstreamOwner = "huwotop";
            const upstreamRepo = "lrc_download";
            const myOwner = context.repo.owner;
            const myRepo = context.repo.repo;
            const targetBranch = process.env.SYNC_TARGET_BRANCH;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            if (!targetBranch) {
              throw new Error("无法确定目标分支，请检查 GitHub Actions 的 ref 配置。");
            }
            console.log(`目标仓库分支：${targetBranch}`);

            // Retry transient upstream asset download failures only.
            async function downloadWithRetry(asset, attempts = 6) {
              for (let attempt = 1; ; attempt++) {
                try {
                  return await github.rest.repos.getReleaseAsset({
                    owner: upstreamOwner,
                    repo: upstreamRepo,
                    asset_id: asset.id,
                    headers: { accept: "application/octet-stream" }
                  });
                } catch (error) {
                  const status = error.status || error.response?.status;
                  const headers = error.response?.headers || {};
                  const rateLimited = status === 403 &&
                    (headers["retry-after"] || headers["x-ratelimit-remaining"] === "0");
                  const retryable = status === 429 || rateLimited ||
                    [500, 502, 503, 504].includes(status);
                  if (!retryable || attempt >= attempts) {
                    throw new Error(`下载 ${asset.name} 失败（${attempt} 次尝试）：${error.message}`);
                  }

                  const retryAfter = Number(headers["retry-after"] || 0) * 1000;
                  const delay = Math.max(retryAfter, Math.min(60000, 2000 * (2 ** (attempt - 1))));
                  console.log(`[重试 ${attempt}/${attempts - 1}] ${asset.name}：HTTP ${status}，等待 ${Math.ceil(delay / 1000)} 秒`);
                  await sleep(delay);
                }
              }
            }

            console.log("正在获取上游最近 3 个 Releases...");
            const upstreamReleases = await github.rest.repos.listReleases({
              owner: upstreamOwner,
              repo: upstreamRepo,
              per_page: 3
            });

            console.log("正在检查目标仓库已有的 Releases...");
            const myReleases = await github.paginate(github.rest.repos.listReleases, {
              owner: myOwner,
              repo: myRepo,
              per_page: 100
            });
            // 同一标签同时存在草稿和正式版本时，优先使用正式版本。
            const myReleaseByTag = new Map();
            for (const item of myReleases) {
              const existing = myReleaseByTag.get(item.tag_name);
              if (!existing || (existing.draft && !item.draft)) {
                myReleaseByTag.set(item.tag_name, item);
              }
            }
            const syncedTags = [];
            const skippedDraftTags = [];
            const draftMarker = "<!-- managed-by-release-sync-v1 -->";

            // Oldest first, so release order remains chronological.
            for (const release of upstreamReleases.data.reverse()) {
              // 按标签直接查找正式版本，避免重复创建、发布同名草稿。
              // 只有 404 才回退到列表；权限、限流和服务错误直接抛出。
              let targetRelease;
              try {
                const published = await github.rest.repos.getReleaseByTag({
                  owner: myOwner,
                  repo: myRepo,
                  tag: release.tag_name
                });
                targetRelease = published.data;
              } catch (error) {
                if ((error.status || error.response?.status) !== 404) throw error;
                targetRelease = myReleaseByTag.get(release.tag_name);
              }
              let createdNow = false;
              // Never modify or publish a draft that was not created by this workflow.
              if (targetRelease?.draft && !(targetRelease.body || "").includes(draftMarker)) {
                skippedDraftTags.push(release.tag_name);
                core.warning(`跳过手动创建的草稿 Release：${release.tag_name}`);
                continue;
              }

              if (!targetRelease) {
                console.log(`[开始] 创建草稿 Release ${release.tag_name}（${release.assets.length} 个附件）...`);
                const created = await github.rest.repos.createRelease({
                  owner: myOwner,
                  repo: myRepo,
                  tag_name: release.tag_name,
                  target_commitish: targetBranch,
                  name: release.name || release.tag_name,
                  body: (release.body || "自动同步自上游仓库更新日志。") + "\n\n" + draftMarker,
                  draft: true,
                  prerelease: release.prerelease
                });
                targetRelease = created.data;
                myReleaseByTag.set(release.tag_name, targetRelease);
                createdNow = true;
              } else {
                console.log(`[续传] 检查并补齐 ${release.tag_name} 的缺失附件...`);
              }

              const existingAssets = await github.paginate(
                github.rest.repos.listReleaseAssets,
                { owner: myOwner, repo: myRepo, release_id: targetRelease.id, per_page: 100 }
              );
              const upstreamAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
                owner: upstreamOwner, repo: upstreamRepo, release_id: release.id, per_page: 100
              });
              const existingByName = new Map(existingAssets.map(asset => [asset.name, asset]));
              let changed = false;
              const fs = require("fs");
              const os = require("os");
              const path = require("path");
              const { execFileSync } = require("child_process");
              const tmp = fs.mkdtempSync(path.join(os.tmpdir(), "sync-release-"));
              const config = path.join(tmp, "curl.conf");
              fs.writeFileSync(config, 'header = "Authorization: Bearer ' + process.env.SYNC_TOKEN + '"\n', { mode: 0o600 });
              const file = path.join(tmp, "asset");
              const matches = (source, dest) => !!dest && dest.state === "uploaded" &&
                source.size === dest.size && !!source.digest && source.digest === dest.digest;
              try {

              for (const asset of upstreamAssets) {
                let downloaded = false;
                const downloadAndHash = () => {
                  console.log("[下载] " + asset.name);
                  execFileSync("curl", ["--fail", "--location", "--silent", "--show-error", "--retry", "5", "--retry-all-errors", "--output", file, asset.browser_download_url], { stdio: "inherit" });
                  if (fs.statSync(file).size !== asset.size) throw new Error("下载大小不匹配：" + asset.name);
                  downloaded = true;
                  return "sha256:" + execFileSync("sha256sum", [file], { encoding: "utf8" }).split(" ")[0];
                };
                if (!asset.digest) {
                  // Older GitHub assets may not expose a digest. Compute one from the download.
                  asset.digest = downloadAndHash();
                } else if (!asset.digest.startsWith("sha256:")) {
                  throw new Error("不支持的摘要算法：" + asset.name);
                }
                const old = existingByName.get(asset.name);
                if (matches(asset, old)) {
                  console.log("[跳过] " + asset.name + " SHA-256摘要一致。");
                  if (downloaded) fs.unlinkSync(file);
                  continue;
                }

                // Verify a staged replacement before removing an existing asset.
                const stagedName = "sync-staged-" + asset.id;
                let staged = existingByName.get(stagedName);
                if (staged && !matches(asset, staged)) {
                  await github.rest.repos.deleteReleaseAsset({ owner: myOwner, repo: myRepo, asset_id: staged.id });
                  staged = null;
                }
                if (!staged) {
                  if (!downloaded && downloadAndHash() !== asset.digest) {
                    throw new Error("下载校验失败：" + asset.name);
                  }
                  const uploadUrl = "https://uploads.github.com/repos/" + encodeURIComponent(myOwner) + "/" + encodeURIComponent(myRepo) + "/releases/" + targetRelease.id + "/assets?name=" + encodeURIComponent(stagedName);
                  const response = execFileSync("curl", ["--config", config, "--fail-with-body", "--silent", "--show-error",
                    "--request", "POST", "--header", "Content-Type: " + (asset.content_type || "application/octet-stream"),
                    "--upload-file", file, uploadUrl], { encoding: "utf8", maxBuffer: 1024 * 1024 });
                  staged = JSON.parse(response);
                  fs.unlinkSync(file);
                  if (!matches(asset, staged)) throw new Error("上传校验失败：" + asset.name);
                  downloaded = false;
                }
                if (downloaded) fs.unlinkSync(file);
                if (old) {
                  await github.rest.repos.deleteReleaseAsset({ owner: myOwner, repo: myRepo, asset_id: old.id });
                }
                const renamed = await github.rest.repos.updateReleaseAsset({
                  owner: myOwner, repo: myRepo, asset_id: staged.id,
                  name: asset.name, label: asset.label || undefined
                });
                if (!matches(asset, renamed.data)) throw new Error("最终校验失败：" + asset.name);
                existingByName.set(asset.name, renamed.data);
                existingByName.delete(stagedName);
                changed = true;
                console.log("[完成] " + asset.name);
              }
              } finally {
                fs.rmSync(tmp, { recursive: true, force: true });
              }

              const uploadedAssets = await github.paginate(
                github.rest.repos.listReleaseAssets,
                { owner: myOwner, repo: myRepo, release_id: targetRelease.id, per_page: 100 }
              );
              const uploadedByName = new Map(uploadedAssets.map(asset => [asset.name, asset]));
              const missing = upstreamAssets.filter(asset => !matches(asset, uploadedByName.get(asset.name)));
              if (missing.length) {
                throw new Error(
                  `校验失败：${release.tag_name} 仍缺少 ${missing.length} 个附件：${missing.slice(0, 5).map(a => a.name).join(", ")}`
                );
              }

              // Publish only after every expected asset is present.
              if (createdNow || targetRelease.draft) {
                await github.rest.repos.updateRelease({
                  owner: myOwner,
                  repo: myRepo,
                  release_id: targetRelease.id,
                  body: (targetRelease.body || "").replace(draftMarker, "").trimEnd(),
                  draft: false
                });
                console.log(`[发布完成] ${release.tag_name}，共 ${uploadedAssets.length} 个附件。`);
                syncedTags.push(release.tag_name);
              } else if (changed) {
                console.log(`[续传完成] ${release.tag_name}，已补齐至 ${uploadedAssets.length} 个附件。`);
                syncedTags.push(release.tag_name);
              } else {
                console.log(`[跳过] ${release.tag_name} 已完整同步。`);
              }
            }

            core.setOutput("synced", String(syncedTags.length > 0));
            core.setOutput("summary", syncedTags.join(", "));
            core.setOutput("skipped_drafts", skippedDraftTags.join(", "));

      - name: Send sync notification email
        if: steps.sync.outputs.synced == 'true'
        uses: dawidd6/action-send-mail@v9
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: 317718961@qq.com
          password: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          subject: ${{ github.event.repository.name }} Releases 同步完成
          to: any@phone.eu.org
          from: 317718961@qq.com
          body: |
            ${{ github.event.repository.name }} Releases 同步已完成。
            本次同步版本：${{ steps.sync.outputs.summary }}

      - name: Report skipped manual drafts
        if: steps.sync.outputs.skipped_drafts != ''
        env:
          SKIPPED_DRAFTS: ${{ steps.sync.outputs.skipped_drafts }}
        run: |
          echo "::error::未同步以下手动草稿 Release：$SKIPPED_DRAFTS"
          exit 1
